{% extends "base.html" %}

{% block title %}{{ ch["name"] }} · Flux TV{% endblock %}

{% block content %}

<a class="back" href="{{ url_for('home') }}">
  ← Toutes les chaînes
</a>

<section class="player-card">

  <div class="player">

    <!-- LECTEUR NATIF DU NAVIGATEUR -->
    <video
      id="video"
      controls
      playsinline
      autoplay
      muted
      preload="metadata"
    ></video>

  </div>

  <div class="player-info">

    <div class="status">
      <span></span>
      EN DIRECT
    </div>

    <h1>{{ ch["name"] }}</h1>

    {% if ch["description"] %}
      <p>{{ ch["description"] }}</p>
    {% endif %}

    <div class="player-actions">

      <button
        class="sound"
        type="button"
        id="soundButton"
      >
        🔊 Activer le son
      </button>

      <button
        class="reload"
        type="button"
        id="reloadButton"
      >
        ↻ Recharger le flux
      </button>

    </div>

  </div>

</section>

<script>
const video = document.getElementById("video");
const src = {{ ch["stream_url"]|tojson }};
const soundButton = document.getElementById("soundButton");
const reloadButton = document.getElementById("reloadButton");

/* Chargement du flux */
video.src = src;
video.load();

/* Lecture automatique si le navigateur l'autorise */
video.play().catch(() => {});

/* =========================
   BOUTON SON
========================= */

soundButton.addEventListener("click", function () {

  if (video.muted) {
    video.muted = false;
    video.volume = 1;
    soundButton.textContent = "🔇 Couper le son";
  } else {
    video.muted = true;
    soundButton.textContent = "🔊 Activer le son";
  }

  video.play().catch(() => {});
});


/* =========================
   RECHARGER LE FLUX
========================= */

reloadButton.addEventListener("click", function () {

  reloadButton.disabled = true;
  reloadButton.textContent = "⟳ Chargement...";

  const currentTime = video.currentTime;

  video.pause();
  video.removeAttribute("src");
  video.load();

  setTimeout(function () {

    video.src = src;
    video.load();

    video.play().catch(() => {});

    reloadButton.disabled = false;
    reloadButton.textContent = "↻ Recharger le flux";

  }, 500);
});


/* =========================
   LECTEUR
========================= */

video.addEventListener("playing", function () {
  reloadButton.disabled = false;
  reloadButton.textContent = "↻ Recharger le flux";
});

video.addEventListener("waiting", function () {
  reloadButton.textContent = "⟳ Chargement...";
});

video.addEventListener("canplay", function () {
  reloadButton.disabled = false;
  reloadButton.textContent = "↻ Recharger le flux";
});

video.addEventListener("error", function () {

  reloadButton.disabled = false;
  reloadButton.textContent = "↻ Recharger le flux";

  console.log("Le flux ne peut pas être lu par le lecteur natif.");
});
</script>

{% endblock %}
