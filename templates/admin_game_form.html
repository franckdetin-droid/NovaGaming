{% extends "base.html" %}
{% block title %}Jeu PPSSPP{% endblock %}
{% block content %}<div class="form-card"><h1>{{'Modifier' if game else 'Ajouter'}} un jeu</h1><form method="post"><label>Nom<input name="name" value="{{game.name if game else ''}}" required></label><label>Image URL<input name="image" value="{{game.image if game else ''}}"></label><label>Description<textarea name="description">{{game.description if game else ''}}</textarea></label><label>Taille<input name="size" value="{{game.size if game else ''}}"></label><label>Lien externe<input name="download_url" value="{{game.download_url if game else ''}}" required></label><button class="btn">Enregistrer</button></form></div>{% endblock %}
