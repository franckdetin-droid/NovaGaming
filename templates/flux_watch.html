{% extends "base.html" %}
{% block title %}{{ channel.name }}{% endblock %}
{% block brand %}<a class="brand" href="{{ url_for('flux_home') }}">📺 FLUX TV</a>{% endblock %}
{% block head %}<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>{% endblock %}
{% block content %}
<div class="watch"><h1>{{ channel.name }}</h1><video id="player" controls playsinline autoplay muted></video><p>{{ channel.description }}</p></div>
<script>
const video=document.getElementById("player");
const source={{ channel.stream_url|tojson }};
if(video.canPlayType("application/vnd.apple.mpegurl")) video.src=source;
else if(window.Hls && Hls.isSupported()){
 const hls=new Hls();
 hls.loadSource(source);
 hls.attachMedia(video);
}
</script>
{% endblock %}
