{% extends "base.html" %}
{% block title %}Chaîne Flux{% endblock %}
{% block content %}<div class="form-card"><h1>{{'Modifier' if channel else 'Ajouter'}} une chaîne</h1><form method="post"><label>Nom<input name="name" value="{{channel.name if channel else ''}}" required></label><label>Logo URL<input name="logo" value="{{channel.logo if channel else ''}}"></label><label>Description<textarea name="description">{{channel.description if channel else ''}}</textarea></label><label>URL du flux<input name="stream_url" value="{{channel.stream_url if channel else ''}}" required></label><button class="btn">Enregistrer</button></form></div>{% endblock %}
