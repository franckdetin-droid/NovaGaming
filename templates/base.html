<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>{% block title %}Flux TV{% endblock %}</title>

<!-- MONETAG -->
<meta name="monetag" content="12c236e62ad7ecaf4156ac13124a9fc6">

<script src="https://quge5.com/88/tag.min.js"
        data-zone="290143"
        async
        data-cfasync="false"></script>

<!-- MONETAG — ZONE 11947840 -->
<script>
(function(s){
    s.dataset.zone='11947840';
    s.src='https://al5sm.com/tag.min.js';
})(

    .pop()
    .appendChild(document.createElement('script'))

</script>

<!-- MONETAG — ZONE 11947841 -->

<script>
(function(s){
    s.dataset.zone='11947916';

})(
    [document.documentElement, document.body]
    .filter(Boolean)
    .pop()
    .appendChild(document.createElement('script'))
);
</script>

<!-- CSS DU SITE -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

{% block head %}{% endblock %}
</head>

<body>

<header class="topbar">

  <a class="brand" href="{{ url_for('home') }}">
    📺 Flux TV
  </a>

  <a class="admin-link" href="{{ url_for('admin_login') }}">
    Administration
  </a>

</header>

<main class="container">

  <!-- PUBLICITÉ HAUT -->
  <div class="ad-slot" id="ad-top"></div>

  {% block content %}{% endblock %}

  <!-- PUBLICITÉ BAS -->
  <div class="ad-slot" id="ad-bottom"></div>

</main>

<footer>
  <div>Flux TV · Diffusion de contenus autorisés</div>
  <div>Fait par Franck</div>
</footer>

</body>
