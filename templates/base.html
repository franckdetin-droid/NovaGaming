<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>{% block title %}Flux TV{% endblock %}</title>

<!-- IDENTIFICATION MONETAG -->
<meta name="monetag" content="12c236e62ad7ecaf4156ac13124a9fc6">

<!-- MONETAG — BANNIÈRE VIGNETTE — ZONE 11947916 -->
<script>
(function(s){
    s.dataset.zone='11947916';
    s.src='https://n6wxm.com/vignette.min.js';
})(
    [document.documentElement, document.body]
    .filter(Boolean)
    .pop()
    .appendChild(document.createElement('script'))
);
</script>

<!-- CSS DU SITE -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

{% block head %}{% endblock %}
</head>

<body>

<header class="topbar">

  <a class="brand" href="{{ url_for('home') }}">
    📺 Flux TV
  </a>

  <a class="admin-link" href="{{ url_for('admin_login') }}">
    Administration
  </a>

</header>

<main class="container">

  <!-- EMPLACEMENT PUBLICITAIRE HAUT -->
  <div class="ad-slot" id="ad-top"></div>

  {% block content %}{% endblock %}

  <!-- EMPLACEMENT PUBLICITAIRE BAS -->
  <div class="ad-slot" id="ad-bottom"></div>

</main>

<footer>
  <div>Flux TV · Diffusion de contenus autorisés</div>
  <div>Fait par Franck</div>
</footer>

</body>
</html>
